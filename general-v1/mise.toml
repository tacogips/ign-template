min_version = "2026.8.3"

[tools]
node = "24"
"npm:agent-browser" = "latest"
"npm:@playwright/test" = "latest"
gitleaks = "latest"
pre-commit = "latest"

[tasks.default]
description = "Show available tasks"
run = "mise tasks ls"

[tasks.status]
description = "Show tracked investigation artifacts"
run = "find design-docs impl-plans -maxdepth 2 -type f | sort"

[tasks.browser-install]
description = "Install the Chromium browser used by Playwright"
run = "playwright install chromium"

[tasks.browser-check]
description = "Show the available investigation tools"
run = "agent-browser --help && playwright --version"

[tasks.gitleaks]
description = "Scan staged changes for secrets"
run = "gitleaks git --pre-commit --redact --staged --verbose"

[tasks.install-git-hooks]
description = "Install pre-commit hooks"
run = "pre-commit install --install-hooks"
