min_version = "2026.8.3"

[[hooks.enter]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko --path "$MISE_PROJECT_ROOT" hook enter bash)"
fi
'''

[[hooks.leave]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko hook leave bash)"
fi
'''

[tools]
go = "@ign-var:GO_VERSION=1.25.4@"
golangci-lint = "latest"
gitleaks = "latest"
pre-commit = "latest"
"go:golang.org/x/tools/gopls" = "latest"

[tasks.default]
description = "Show available tasks"
run = "mise tasks ls"

[tasks.build]
description = "Build the binary"
run = "go build -o @ign-var:PROJECT_NAME={current_dir}@ ./cmd/@ign-var:PROJECT_NAME@"

[tasks."build:homebrew"]
description = "Build Homebrew release archives"
run = "scripts/build-homebrew-release.sh"

[tasks."homebrew:formula"]
description = "Render the Homebrew formula"
run = "scripts/render-homebrew-formula.sh"

[tasks."homebrew:tap-formula"]
description = "Render the formula into the default sibling tap"
run = '''
if [ "$#" -eq 0 ]; then
  echo "usage: mise run homebrew:tap-formula -- <version>" >&2
  exit 2
fi
scripts/render-homebrew-formula.sh "$1" "../homebrew-tap/Formula/@ign-var:PROJECT_NAME@.rb"
'''

[tasks.run]
description = "Build and run the application"
run = "mise run build && ./@ign-var:PROJECT_NAME={current_dir}@"

[tasks.test]
description = "Run tests"
run = "go test -v ./..."

[tasks.test-coverage]
description = "Run tests with coverage"
run = "go test -coverprofile=coverage.out ./... && go tool cover -html=coverage.out -o coverage.html"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "Format code"
run = "go fmt ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.gitleaks]
description = "Scan staged changes for secrets"
run = "gitleaks git --pre-commit --redact --staged --verbose"

[tasks.install-git-hooks]
description = "Install pre-commit hooks"
run = "pre-commit install --install-hooks"

[tasks.clean]
description = "Clean build artifacts"
run = "rm -f @ign-var:PROJECT_NAME={current_dir}@ coverage.out coverage.html"

[tasks.tidy]
description = "Tidy Go modules"
run = "go mod tidy"
